# Evita que Supabase pause el proyecto por inactividad.
#
# Los proyectos del plan gratuito se pausan tras unos días sin actividad, y
# cuando eso pasa la app deja de mostrarle las secciones a los estudiantes.
# Este workflow hace una consulta mínima cada dos días para mantenerlo vivo.
#
# Las credenciales se leen del propio código (src/lib/supabase.ts), así que si
# algún día mudás el proyecto a otra cuenta no hay que tocar nada acá.
# La anon key es pública (viaja en el bundle del sitio), no es un secreto.

name: Mantener Supabase despierto

on:
  schedule:
    # 12:00 UTC, cada dos días.
    - cron: "0 12 */2 * *"
  # Permite ejecutarlo a mano desde la pestaña Actions.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer credenciales de src/lib/supabase.ts
        id: cfg
        run: |
          FILE=src/lib/supabase.ts
          URL=$(sed -n 's/.*SUPABASE_URL[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$FILE" | head -1)
          KEY=$(sed -n 's/.*SUPABASE_ANON_KEY[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$FILE" | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "No pude leer la URL o la key de $FILE"; exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Proyecto: $URL"

      - name: Consultar la base
        run: |
          # Si curl no llega al servidor (p. ej. el dominio no existe) devuelve
          # un codigo de error; lo capturamos para poder explicar que paso.
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 30 \
            -H "apikey: ${{ steps.cfg.outputs.key }}" \
            "${{ steps.cfg.outputs.url }}/rest/v1/topic_visibility?select=slug&limit=1") || code="000"
          echo "HTTP $code"
          cat /tmp/out.json 2>/dev/null || true
          if [ "$code" = "000" ]; then
            echo "::error::No se pudo conectar: el dominio del proyecto no responde. Probablemente fue pausado o eliminado, revisalo en supabase.com."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Supabase respondio HTTP $code. Puede que la key haya cambiado."
            exit 1
          fi
          echo "Proyecto activo."
